<!DOCTYPE html>
<html>
<head>
    <title>Generate Extension Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #1976D2;
        }
        .icon-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Extension Icon Generator</h1>
    <p>Click the buttons below to download the icons for the extension.</p>

    <div class="icon-container">
        <div class="icon-item">
            <canvas id="icon16" width="16" height="16"></canvas>
            <br>
            <button onclick="downloadIcon('icon16', 16)">Download 16x16</button>
        </div>
        <div class="icon-item">
            <canvas id="icon48" width="48" height="48"></canvas>
            <br>
            <button onclick="downloadIcon('icon48', 48)">Download 48x48</button>
        </div>
        <div class="icon-item">
            <canvas id="icon128" width="128" height="128"></canvas>
            <br>
            <button onclick="downloadIcon('icon128', 128)">Download 128x128</button>
        </div>
    </div>

    <script>
        function createIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#2196F3';
            ctx.fillRect(0, 0, size, size);

            // Draw Sigma symbol
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.7}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Σ', size / 2, size / 2);
        }

        function downloadIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Create all icons on page load
        createIcon('icon16', 16);
        createIcon('icon48', 48);
        createIcon('icon128', 128);
    </script>

    <p><strong>Instructions:</strong></p>
    <ol>
        <li>Click each download button to save the icons</li>
        <li>Save them in the extension directory as icon16.png, icon48.png, and icon128.png</li>
        <li>Then you can load the extension in Chrome</li>
    </ol>
</body>
</html>
